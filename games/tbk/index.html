<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bee's Knees — Hedera Card Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/game.css" />
  <style>
    :root {
      /* TBK Hedera Theme — drop real assets in /games/tbk/assets/ */
      --tbk-green: #3BDC96;
      --tbk-gold: #FFD700;
      --tbk-bg: #080808;
      --tbk-bg-2: #0f0f0f;
      --tbk-accent: var(--tbk-green);
    }
    .game-header { border-color: rgba(59,220,150,0.2); }
    .turn-badge { background: rgba(59,220,150,0.12); border-color: rgba(59,220,150,0.3); color: var(--tbk-green); }
    .card:hover { border-color: var(--tbk-green); box-shadow: 0 0 30px rgba(59,220,150,0.25); }
    .card.can-attack { box-shadow: 0 0 12px rgba(59,220,150,0.35); }
    .health-fill { background: linear-gradient(90deg, #2aaa6a, var(--tbk-green)); }
    .deck-pile span, .discard-pile span { color: var(--tbk-green); }
    .btn-primary { background: var(--tbk-green); color: #000; }
    .btn-primary:hover { background: #2aaa6a; }
    .game-logo img { max-height: 40px; }
    .game-container { background: center/cover no-repeat fixed; }
    .board-selector-btn { background: transparent; color: var(--tbk-green); border: 1px solid var(--tbk-green); }
    .board-selector-btn:hover { background: var(--tbk-green); color: #000; }
    .board-modal {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
    }
    .board-modal.active { display: flex; }
    .board-modal-inner {
      background: #0f0f0f; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 24px; max-width: 800px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .board-modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .board-thumb {
      cursor: pointer; border-radius: 10px; overflow: hidden;
      border: 2px solid transparent; transition: all 0.2s;
      aspect-ratio: 16/9; background-size: cover; background-position: center;
    }
    .board-thumb:hover { border-color: var(--tbk-green); transform: scale(1.03); }
    .board-thumb.active { border-color: var(--tbk-green); box-shadow: 0 0 12px rgba(59,220,150,0.4); }
    .board-label {
      background: rgba(0,0,0,0.6); color: #fff; font-size: 0.7rem;
      font-weight: 700; padding: 4px 8px; text-align: center;
    }
    @media (max-width: 600px) { .board-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <a href="/games/" class="game-logo">
        <img src="assets/logo.png" alt="The Bee's Knees" onerror="this.src='/assets/goodebags-logo.png'" />
      </a>
      <div class="game-meta">
        <span id="turnIndicator" class="turn-badge">Your Turn</span>
        <button id="endTurnBtn" class="btn btn-primary btn-sm">End Turn</button>
        <a href="/games/" class="btn btn-outline btn-sm">Back</a>
      </div>
    </header>

    <main class="game-board">
      <!-- Opponent Area -->
      <section class="opponent-area">
        <div class="player-info">
          <span class="player-name">AI Opponent</span>
          <div class="health-bar">
            <div id="aiHealth" class="health-fill" style="width:100%"></div>
            <span id="aiHealthText" class="health-text">20 / 20</span>
          </div>
        </div>
        <div id="aiHand" class="hand opponent-hand"></div>
        <div id="aiBoard" class="board opponent-board"></div>
      </section>

      <!-- Battle Zone -->
      <section class="battle-zone">
        <div id="battleLog" class="battle-log"></div>
      </section>

      <!-- Player Area -->
      <section class="player-area">
        <div id="playerBoard" class="board player-board"></div>
        <div id="playerHand" class="hand player-hand"></div>
        <div class="player-info">
          <span class="player-name">You</span>
          <div class="health-bar">
            <div id="playerHealth" class="health-fill" style="width:100%"></div>
            <span id="playerHealthText" class="health-text">20 / 20</span>
          </div>
          <div class="mana-pool">
            <span id="manaText">Mana: 1 / 1</span>
          </div>
        </div>
      </section>
    </main>

    <aside class="game-sidebar">
      <div class="deck-info">
        <div class="deck-pile">
          <span id="deckCount">30</span>
          <label>Deck</label>
        </div>
        <div class="discard-pile">
          <span id="discardCount">0</span>
          <label>Discard</label>
        </div>
      </div>
      <button id="boardBtn" class="btn btn-outline btn-sm board-selector-btn">Board</button>
      <button id="restartBtn" class="btn btn-outline btn-sm">Restart</button>
    </aside>
  </div>

  <!-- Board Selector Modal -->
  <div id="boardModal" class="board-modal">
    <div class="board-modal-inner">
      <h3>Choose Your Table</h3>
      <div class="board-grid" id="boardGrid"></div>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script>
    (function() {
      const boards = [
        { name: 'Green', file: 'boards/green.png' },
        { name: 'Magical Glow', file: 'boards/magical-glow.png' },
        { name: 'Plain Bees', file: 'boards/plain-bees.png' },
        { name: 'TBK Themed', file: 'boards/tbk-themed.png' },
        { name: 'Slime', file: 'boards/slime.png' },
        { name: 'Goodebags', file: 'boards/goodebags.png' },
      ];
      const LS_KEY = 'tbk-board';
      const container = document.querySelector('.game-container');
      const modal = document.getElementById('boardModal');
      const grid = document.getElementById('boardGrid');

      function applyBoard(file) {
        container.style.backgroundImage = `url('assets/${file}')`;
        localStorage.setItem(LS_KEY, file);
      }

      function renderGrid() {
        const current = localStorage.getItem(LS_KEY) || boards[0].file;
        grid.innerHTML = boards.map(b => `
          <div class="board-thumb ${b.file === current ? 'active' : ''}"
               style="background-image:url('assets/${b.file}')"
               data-file="${b.file}">
            <div class="board-label">${b.name}</div>
          </div>
        `).join('');
        grid.querySelectorAll('.board-thumb').forEach(el => {
          el.addEventListener('click', () => {
            applyBoard(el.dataset.file);
            modal.classList.remove('active');
            renderGrid();
          });
        });
      }

      // Init
      applyBoard(localStorage.getItem(LS_KEY) || boards[0].file);

      document.getElementById('boardBtn').addEventListener('click', () => {
        renderGrid();
        modal.classList.add('active');
      });
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
    })();
  </script>
</body>
</html>
